<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIGANO MDC - Gestion des Absences V7</title>
  <style>
    :root {
      --trigano-red: #E30613;
      --bg-dark: #0a0e17;
      --card-dark: #141c2e;
      --border-dark: #232f48;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --accent-orange: #f59e0b;
      --accent-green: #10b981;
      --accent-blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* HEADER & CALENDRIER */
    header { background-color: #060910; padding: 1.5vh 2vw; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5vh solid var(--trigano-red); }
    .brand { display: flex; align-items: center; gap: 1.2vw; }
    .logo-box { background-color: var(--trigano-red); color: white; font-weight: 900; font-size: 3vh; padding: 0.8vh 1.5vw; border-radius: 0.5vh; letter-spacing: 0.2vw; }
    .site-title { font-size: 3.2vh; font-weight: 700; color: var(--text-gray); text-transform: uppercase; }
    
    .date-picker-container { display: flex; align-items: center; gap: 1vw; background: var(--card-dark); padding: 0.5vh 1vw; border-radius: 1vh; border: 0.2vh solid var(--border-dark); transition: all 0.3s; }
    .date-label { font-weight: 700; color: var(--text-gray); font-size: 1.8vh; text-transform: uppercase; }
    input[type="date"] { background: var(--bg-dark); color: white; border: 0.2vh solid var(--border-dark); padding: 1vh; font-size: 2.2vh; border-radius: 0.5vh; font-weight: 700; cursor: pointer; color-scheme: dark; }

    .archive-active { border-color: var(--accent-orange) !important; background: rgba(245, 158, 11, 0.1) !important; }
    .archive-active .date-label { color: var(--accent-orange); }
    
    .btn-today { display: none; background: var(--accent-orange); color: black; border: none; padding: 1vh 1vw; font-weight: 800; font-size: 1.6vh; border-radius: 0.5vh; cursor: pointer; text-transform: uppercase; }

    /* CONTENU PRINCIPAL */
    main { flex: 1; padding: 2vh 2vw; display: flex; flex-direction: column; gap: 2vh; overflow-y: auto; }

    .add-bar { background-color: var(--card-dark); border: 0.2vh solid var(--border-dark); border-left: 0.8vh solid var(--accent-green); border-radius: 1vh; padding: 1.5vh 2vw; display: flex; gap: 1.5vw; align-items: center; }
    .add-bar input[type="text"] { flex: 1; padding: 1.2vh; background: var(--bg-dark); border: 0.2vh solid var(--border-dark); color: white; font-size: 1.8vh; border-radius: 0.5vh; }
    .add-bar select { padding: 1.2vh; background: var(--bg-dark); border: 0.2vh solid var(--border-dark); color: white; font-size: 1.8vh; border-radius: 0.5vh; cursor: pointer; }
    .btn-add { background: var(--accent-green); color: #000; border: none; padding: 1.2vh 2vw; font-size: 1.8vh; font-weight: 700; border-radius: 0.5vh; cursor: pointer; }

    /* TABLEAU */
    .table-container { background: var(--card-dark); border: 0.2vh solid var(--border-dark); border-radius: 1vh; overflow: hidden; flex: 1; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #060910; padding: 1.5vh 1vw; font-size: 1.5vh; color: var(--text-gray); text-transform: uppercase; border-bottom: 0.2vh solid var(--border-dark); }
    td { padding: 1.2vh 1vw; border-bottom: 0.1vh solid var(--border-dark); font-size: 1.8vh; vertical-align: middle; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .badge-contrat { padding: 0.4vh 0.8vw; border-radius: 0.5vh; font-size: 1.3vh; font-weight: 800; text-transform: uppercase; }
    .badge-trigano { background: rgba(227, 6, 19, 0.15); color: var(--trigano-red); border: 0.1vh solid var(--trigano-red); }
    .badge-adecco { background: rgba(234, 10, 42, 0.15); color: #ff4d6d; border: 0.1vh solid #ea0a2a; }

    .motif-selector { background: var(--bg-dark); color: white; border: 0.2vh solid var(--border-dark); padding: 0.8vh 1vw; font-size: 1.6vh; font-weight: 600; border-radius: 0.5vh; width: 100%; cursor: pointer; }
    .motif-selector option { background: var(--card-dark); color: white; padding: 0.5vh; }
    .btn-clear { background: transparent; border: none; color: var(--trigano-red); font-size: 2vh; cursor: pointer; padding: 0.5vh 0.5vw; border-radius: 0.5vh; margin-left: 0.5vw; }

    .hours-input-wrapper { display: flex; align-items: center; gap: 0.5vw; background: var(--bg-dark); padding: 0.5vh 0.8vw; border-radius: 0.5vh; border: 0.2vh solid var(--border-dark); width: max-content; margin: 0 auto; }
    .hours-input { width: 3.5vw; background: transparent; border: none; color: white; font-size: 1.8vh; font-weight: 700; text-align: right; outline: none; }
    .hours-label { color: var(--text-gray); font-size: 1.5vh; font-weight: 700; }

    .btn-justif { padding: 0.8vh 1vw; font-size: 1.4vh; font-weight: 700; border-radius: 0.5vh; border: 0.2vh solid; cursor: pointer; width: 100%; text-align: center; }
    .btn-justif.no { background: rgba(227, 6, 19, 0.1); border-color: var(--trigano-red); color: var(--trigano-red); }
    .btn-justif.yes { background: rgba(16, 185, 129, 0.1); border-color: var(--accent-green); color: var(--accent-green); }
    .btn-delete { background: transparent; border: none; color: var(--text-gray); font-size: 2vh; cursor: pointer; }

    /* FOOTER */
    .summary-bar { display: flex; justify-content: space-between; align-items: center; background: #060910; padding: 1.5vh 2vw; border-top: 0.2vh solid var(--border-dark); }
    .counters { display: flex; gap: 2.5vw; }
    .counter-item { display: flex; flex-direction: column; }
    .counter-label { font-size: 1.4vh; color: var(--text-gray); text-transform: uppercase; font-weight: 700; }
    .counter-value { font-size: 2.8vh; font-weight: 900; }
    .val-green { color: var(--accent-green); }
    .val-red { color: var(--trigano-red); }
    .val-blue { color: var(--accent-blue); }

    .action-group { display: flex; gap: 1vw; }
    .btn-action { background: var(--card-dark); color: var(--text-white); border: 0.2vh solid var(--border-dark); padding: 1.2vh 1.2vw; border-radius: 0.5vh; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5vw; font-size: 1.6vh; }
    .btn-save { background: var(--accent-green); color: black; border: none; }
    
    @keyframes pulse-orange { 0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.7); } 70% { box-shadow: 0 0 0 10px rgba(245,158,11,0); } 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); } }
    .toast { visibility: hidden; min-width: 300px; background-color: var(--accent-green); color: black; text-align: center; border-radius: 0.5vh; padding: 1.5vh; position: fixed; z-index: 1000; left: 50%; bottom: 10vh; font-size: 1.8vh; font-weight: bold; transform: translateX(-50%); }
    .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 10vh; opacity: 1;} }
    @keyframes fadeout { from {bottom: 10vh; opacity: 1;} to {bottom: 0; opacity: 0;} }

    /* ELEMENTS SPÉCIFIQUES IMPRESSION */
    .print-only-text { display: none; }
    .print-signature { display: none; }
    .print-header-details { display: none; }

    /* =========================================
       MODE IMPRESSION (Rapport Propre & Classé)
       ========================================= */
    @media print {
      @page { margin: 1.5cm; size: A4 portrait; }
      body { background-color: white !important; color: black !important; height: auto; font-family: Arial, sans-serif; }
      
      /* Cacher l'interface logicielle */
      .date-picker-container, .btn-today, .add-bar, .action-group, .btn-delete, .motif-selector, .btn-clear, .hours-input-wrapper, .btn-justif, .toast { display: none !important; }
      
      /* Header du document */
      header { background: white !important; border-bottom: 3px solid black !important; padding: 0 0 15px 0 !important; margin-bottom: 20px; flex-direction: column; align-items: flex-start; }
      .brand { margin-bottom: 10px; }
      .logo-box { background: black !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 5px 10px; }
      .site-title { color: black !important; font-size: 18px; }
      
      /* Date imprimée sous le logo */
      .print-header-details { display: block !important; font-size: 16px; font-weight: bold; margin-top: 10px; color: #333; }

      /* Résumé en haut de page */
      .summary-bar { background: #f8f9fa !important; border: 2px solid black !important; padding: 15px !important; margin-bottom: 20px; display: flex !important; justify-content: space-around !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; border-radius: 0; }
      .counter-item { text-align: center; }
      .counter-label { color: #555 !important; font-size: 12px !important; display: block; margin-bottom: 5px; }
      .counter-value { color: black !important; font-size: 24px !important; }

      /* Structure du tableau */
      main { padding: 0 !important; display: block; overflow: visible; }
      .table-container { border: none !important; border-radius: 0 !important; }
      table { border-collapse: collapse; width: 100%; border: 2px solid black; }
      th { background: #e2e8f0 !important; color: black !important; border: 1px solid black; padding: 10px; font-size: 12px; text-align: left; -webkit-print-color-adjust: exact; }
      td { border: 1px solid black; color: black !important; padding: 8px 10px; font-size: 13px; }
      
      /* Badges Contrat propres */
      .badge-contrat { border: 1px solid black !important; color: black !important; background: transparent !important; padding: 2px 5px; font-size: 11px; }
      
      /* Affichage propre des statuts (remplace boutons/menus) */
      .print-only-text { display: block !important; }
      .print-absent-row td { background-color: #fff1f2 !important; -webkit-print-color-adjust: exact; } /* Légèrement grisé/rosé pour les absents */
      .status-present { color: #64748b; font-style: italic; }
      .status-absent { font-weight: bold; color: black; }

      /* Zone de signature en bas */
      .print-signature { display: flex !important; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px dashed #ccc; }
      .sig-box { border: 1px solid #000; width: 250px; height: 100px; margin-top: 10px; }
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">✅ Sauvegardé avec succès !</div>

  <header>
    <div class="brand">
      <div class="logo-box">TRIGANO</div>
      <div class="site-title">Rapport d'Absences - Ligne 6</div>
    </div>
    <!-- Visible uniquement à l'impression -->
    <div class="print-header-details" id="print-date-display">Date du rapport : --/--/----</div>
    
    <div style="display: flex; gap: 1vw; align-items: center;">
      <button id="btn-today" class="btn-today" onclick="goToToday()">📅 Aujourd'hui</button>
      <div class="date-picker-container" id="date-wrapper">
        <span class="date-label">📅 Date :</span>
        <input type="date" id="calendar-date" onchange="changeDate()">
      </div>
    </div>
  </header>

  <div class="summary-bar">
    <div class="counters">
      <div class="counter-item">
        <span class="counter-label">Effectif Présent</span>
        <span class="counter-value val-green" id="count-present">0</span>
      </div>
      <div class="counter-item">
        <span class="counter-label">Personnes Absentes/En Retard</span>
        <span class="counter-value val-red" id="count-absent">0</span>
      </div>
      <div class="counter-item">
        <span class="counter-label">Total Heures Perdues</span>
        <span class="counter-value val-blue" id="count-hours">0 h</span>
      </div>
    </div>
    <div class="action-group">
      <button id="btn-save" class="btn-action btn-save" onclick="manualSave()">💾 Enregistré</button>
      <button class="btn-action" onclick="window.print()">🖨️ Imprimer Rapport</button>
      <button class="btn-action" style="background:#0f172a; border-color:#0369a1; color:#38bdf8;" onclick="exportCSV()">📊 Excel</button>
    </div>
  </div>

  <main>
    <div class="add-bar" id="add-bar-section">
      <input type="text" id="emp-name" placeholder="Nom et Prénom du salarié" autocomplete="off">
      <select id="emp-type">
        <option value="trigano">CDI / CDD Trigano</option>
        <option value="adecco">Intérim Adecco</option>
      </select>
      <button class="btn-add" onclick="addEmployee()">+ Ajouter au registre</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 20%;">Salarié</th>
            <th style="width: 12%;">Contrat</th>
            <th style="width: 38%;">Statut / Motif</th>
            <th style="width: 10%; text-align: center;">Heures</th>
            <th style="width: 15%; text-align: center;">Justificatif</th>
            <th style="width: 5%; text-align: center;" class="col-delete">Suppr.</th>
          </tr>
        </thead>
        <tbody id="employee-list">
          <!-- Injecté par JS -->
        </tbody>
      </table>
    </div>

    <!-- Espace Signature (Visible Impression) -->
    <div class="print-signature">
      <div>
        <strong>Notes / Commentaires :</strong>
        <div style="width: 300px; border-bottom: 1px dotted black; margin-top: 25px;"></div>
        <div style="width: 300px; border-bottom: 1px dotted black; margin-top: 25px;"></div>
      </div>
      <div>
        <strong>Visa du Manager / Chef d'équipe :</strong>
        <div class="sig-box"></div>
      </div>
    </div>
  </main>

  <script>
    const MOTIFS_CONFIG = {
      'present': { label: 'Présent', hours: 0, autoJustified: true },
      'matin': { label: 'Absent Matin', hours: 4.5, autoJustified: false },
      'aprem': { label: 'Absent Après-Midi', hours: 4.0, autoJustified: false },
      'journee': { label: 'Absent Journée Complète', hours: 8.5, autoJustified: false },
      'retard': { label: 'Retard', hours: 0.5, autoJustified: false },
      'depart_anticipe': { label: 'Départ Anticipé', hours: 1.0, autoJustified: false },
      'maladie': { label: 'Arrêt Maladie (AM)', hours: 8.5, autoJustified: true },
      'accident_travail': { label: 'Accident du Travail (AT)', hours: 8.5, autoJustified: true },
      'cp': { label: 'Congé Payé (CP)', hours: 8.5, autoJustified: true },
      'rtt': { label: 'RTT / Repos', hours: 8.5, autoJustified: true },
      'sans_solde': { label: 'Congé Sans Solde', hours: 8.5, autoJustified: true },
      'evenement_familial': { label: 'Événement Familial', hours: 8.5, autoJustified: true },
      'injustifie': { label: 'Absence Injustifiée', hours: 8.5, autoJustified: false },
      'formation': { label: 'Formation / Mission', hours: 8.5, autoJustified: true },
      'visite_medicale': { label: 'Visite Médicale', hours: 2.0, autoJustified: true }
    };

    let db = { roster: [], history: {} };
    let selectedDate = "";
    let unsavedChanges = false;
    
    function getTodayString() { return new Date().toISOString().split('T')[0]; }
    
    function formatDateFR(dateStr) {
      if(!dateStr) return "";
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function loadDatabase() {
      const saved = localStorage.getItem('triganoDB_V7');
      if (saved) db = JSON.parse(saved);
      goToToday();
    }

    function markUnsaved() {
      unsavedChanges = true;
      const btn = document.getElementById('btn-save');
      btn.innerHTML = "⚠️ Enregistrer";
      btn.style.backgroundColor = "var(--accent-orange)";
      btn.style.animation = "pulse-orange 1.5s infinite";
    }

    function manualSave() {
      localStorage.setItem('triganoDB_V7', JSON.stringify(db));
      unsavedChanges = false;
      const btn = document.getElementById('btn-save');
      btn.innerHTML = "✅ Enregistré";
      btn.style.backgroundColor = "var(--accent-green)";
      btn.style.animation = "none";
      const toast = document.getElementById("toast");
      toast.className = "toast show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    window.addEventListener('beforeunload', (e) => {
      if (unsavedChanges) { e.preventDefault(); e.returnValue = ''; }
    });

    function initDay(date) {
      let isNewInit = false;
      if (!db.history[date]) {
        db.history[date] = db.roster.map(emp => ({ id: emp.id, name: emp.name, type: emp.type, status: 'present', hours: 0, justified: true }));
        isNewInit = true;
      } else {
        db.roster.forEach(emp => {
          if (!db.history[date].find(e => e.id === emp.id)) {
            db.history[date].push({ id: emp.id, name: emp.name, type: emp.type, status: 'present', hours: 0, justified: true });
            isNewInit = true;
          }
        });
      }
      if (isNewInit) localStorage.setItem('triganoDB_V7', JSON.stringify(db));
    }

    function changeDate() {
      if (unsavedChanges) manualSave();
      selectedDate = document.getElementById('calendar-date').value;
      
      // Update print header date
      document.getElementById('print-date-display').textContent = `Date du registre : ${formatDateFR(selectedDate)}`;

      const today = getTodayString();
      if (selectedDate !== today) {
        document.body.classList.add('is-archive');
        document.getElementById('date-wrapper').classList.add('archive-active');
        document.getElementById('add-bar-section').style.display = 'none'; 
        document.getElementById('btn-today').style.display = 'block';      
      } else {
        document.body.classList.remove('is-archive');
        document.getElementById('date-wrapper').classList.remove('archive-active');
        document.getElementById('add-bar-section').style.display = 'flex';
        document.getElementById('btn-today').style.display = 'none';
      }

      initDay(selectedDate);
      renderTable();
      const btn = document.getElementById('btn-save');
      btn.innerHTML = "✅ Enregistré";
      btn.style.backgroundColor = "var(--accent-green)";
      btn.style.animation = "none";
    }

    function goToToday() {
      document.getElementById('calendar-date').value = getTodayString();
      changeDate(); 
    }

    function addEmployee() {
      const name = document.getElementById('emp-name').value.trim();
      if (!name) return alert("Veuillez entrer un nom.");
      const type = document.getElementById('emp-type').value;
      const newEmp = { id: Date.now().toString(), name, type };
      db.roster.push(newEmp); 
      db.history[selectedDate].push({ ...newEmp, status: 'present', hours: 0, justified: true });
      document.getElementById('emp-name').value = "";
      markUnsaved(); renderTable();
    }

    function removeEmployee(id) {
      if (confirm("Retirer définitivement ce salarié ?")) {
        db.roster = db.roster.filter(emp => emp.id !== id);
        db.history[selectedDate] = db.history[selectedDate].filter(emp => emp.id !== id);
        markUnsaved(); renderTable();
      }
    }

    function setMotif(id, motifKey) {
      const emp = db.history[selectedDate].find(e => e.id === id);
      if (emp) {
        emp.status = motifKey;
        emp.hours = MOTIFS_CONFIG[motifKey].hours;
        emp.justified = MOTIFS_CONFIG[motifKey].autoJustified;
        markUnsaved(); renderTable();
      }
    }

    function updateHours(id, value) {
      const emp = db.history[selectedDate].find(e => e.id === id);
      if (emp) {
        let h = parseFloat(value) || 0;
        emp.hours = h;
        if (h === 0) { emp.status = 'present'; emp.justified = true; }
        markUnsaved(); renderTable();
      }
    }

    function toggleJustified(id) {
      const emp = db.history[selectedDate].find(e => e.id === id);
      if (emp && emp.hours > 0) {
        emp.justified = !emp.justified;
        markUnsaved(); renderTable();
      }
    }

    function exportCSV() {
      if (unsavedChanges) manualSave();
      const dayData = db.history[selectedDate];
      if (!dayData || !dayData.length) return alert("Aucune donnée.");
      let csvContent = "data:text/csv;charset=utf-8,\uFEFFDate: " + formatDateFR(selectedDate) + "\n\nSalarie;Contrat;Motif;Heures;Justifie\n";
      dayData.forEach(emp => {
        let m = MOTIFS_CONFIG[emp.status] ? MOTIFS_CONFIG[emp.status].label : emp.status;
        let c = emp.type === 'adecco' ? 'Adecco' : 'Trigano';
        let j = emp.hours > 0 ? (emp.justified ? 'OUI' : 'NON') : '-';
        csvContent += `${emp.name};${c};${m};${emp.hours};${j}\n`;
      });
      const link = document.createElement("a");
      link.href = encodeURI(csvContent);
      link.download = `Absences_Ligne6_${selectedDate}.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function renderTable() {
      const tbody = document.getElementById('employee-list');
      tbody.innerHTML = ""; 
      const dayData = db.history[selectedDate] || [];

      // TRI : Les absents en haut (hours > 0), puis ordre alphabétique
      dayData.sort((a, b) => {
        if ((a.hours > 0) && (b.hours === 0)) return -1;
        if ((a.hours === 0) && (b.hours > 0)) return 1;
        return a.name.localeCompare(b.name);
      });

      dayData.forEach(emp => {
        const tr = document.createElement('tr');
        if (emp.hours > 0) tr.classList.add('print-absent-row'); // Classe spéciale pour surligner à l'impression

        const badgeClass = emp.type === 'adecco' ? 'badge-adecco' : 'badge-trigano';
        const badgeText = emp.type === 'adecco' ? 'ADECCO' : 'TRIGANO';
        let motifLabel = MOTIFS_CONFIG[emp.status] ? MOTIFS_CONFIG[emp.status].label : emp.status;

        let selectOptionsHtml = "";
        for (const [key, val] of Object.entries(MOTIFS_CONFIG)) {
          selectOptionsHtml += `<option value="${key}" ${emp.status === key ? 'selected' : ''}>${val.label === 'Présent' ? '✅ Présent' : val.label}</option>`;
        }

        // Texte Propre pour l'impression
        let printStatusText = `<span class="print-only-text status-present">Présent</span>`;
        let printJustifText = "-";
        let printHoursText = "-";
        
        if (emp.hours > 0) {
          printStatusText = `<span class="print-only-text status-absent">❌ ${motifLabel}</span>`;
          printHoursText = `<span class="print-only-text status-absent">${emp.hours}h</span>`;
          printJustifText = emp.justified 
            ? `<span class="print-only-text">✅ Oui (Justifié)</span>` 
            : `<span class="print-only-text" style="font-weight:bold;">⚠️ Non Justifié</span>`;
        }

        tr.innerHTML = `
          <td><strong>${emp.name}</strong></td>
          <td><span class="badge-contrat ${badgeClass}">${badgeText}</span></td>
          <td>
            <div style="display: flex; align-items: center;">
              <select class="motif-selector" onchange="setMotif('${emp.id}', this.value)">${selectOptionsHtml}</select>
              ${emp.hours > 0 ? `<button class="btn-clear" onclick="setMotif('${emp.id}', 'present')" title="Annuler">✖️</button>` : ''}
            </div>
            ${printStatusText}
          </td>
          <td style="text-align: center;">
            ${emp.hours > 0 ? `
              <div class="hours-input-wrapper">
                <input type="number" class="hours-input" value="${emp.hours}" min="0" max="8.5" step="0.5" onchange="updateHours('${emp.id}', this.value)">h
              </div>` : '<span class="hours-input-wrapper" style="opacity:0.3; border-color:transparent;">-</span>'
            }
            ${printHoursText}
          </td>
          <td style="text-align: center;">
            ${emp.hours > 0 ? `
              <button class="btn-justif ${emp.justified ? 'yes' : 'no'}" onclick="toggleJustified('${emp.id}')">
                ${emp.justified ? '✅ Justifié' : '⚠️ Non justifié'}
              </button>` : '<span class="btn-justif" style="opacity:0; pointer-events:none;">-</span>'
            }
            ${printJustifText}
          </td>
          <td style="text-align: center;" class="col-delete">
            <button class="btn-delete" onclick="removeEmployee('${emp.id}')">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Mettre à jour les compteurs
      document.getElementById('count-present').textContent = dayData.filter(e => e.hours === 0).length;
      document.getElementById('count-absent').textContent = dayData.filter(e => e.hours > 0).length;
      document.getElementById('count-hours').textContent = dayData.reduce((s, e) => s + (parseFloat(e.hours) || 0), 0) + " h";
    }

    loadDatabase();
    document.getElementById('emp-name').addEventListener('keypress', (e) => { if (e.key === 'Enter') addEmployee(); });
  </script>
</body>
</html>
